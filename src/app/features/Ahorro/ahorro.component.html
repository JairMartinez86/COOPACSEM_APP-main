<app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>

<section class="section">
  <div class="main-content">
    <div class="page-header mb-3">
      <div>
        <h1 class="page-title">Ahorro</h1>
        <p class="text-muted mb-0">
          Consulta, gestiona y monitorea los ahorros de los socios. Revisa movimientos, solicitudes, planes y genera reportes.
        </p>
      </div>
    </div>

    <app-ahorro-summary-cards [cards]="cards"></app-ahorro-summary-cards>

    <div class="row g-3">
      <div class="col-xxl-9 col-xl-8">
        <div class="card">
          <div class="card-body">
            <app-ahorro-filters></app-ahorro-filters>

            @switch (activeTab) {
              @case ('socios') {
                <app-socios-table [rows]="socioRows"></app-socios-table>
              }
              @case ('ahorros') {
                <app-ahorros-table [rows]="movimientoRows"></app-ahorros-table>
              }
              @case ('retiros') {
                <app-retiros-table [rows]="retiroRows"></app-retiros-table>
              }
              @case ('depositos') {
                <app-depositos-table [rows]="depositoRows"></app-depositos-table>
              }
              @case ('cuentas') {
                <app-cuentas-table [rows]="cuentaRows"></app-cuentas-table>
              }
            }
          </div>
        </div>

        <app-ahorro-socio-resumen
          [socio]="selectedSocio"
          [ahorrosRows]="movimientoRows"
          [retirosRows]="retiroRows"
          [depositosRows]="depositoRows"
          [solicitudesRows]="retiroRows"
          [planesRows]="depositoRows">
        </app-ahorro-socio-resumen>
      </div>

      <div class="col-xxl-3 col-xl-4">
        <app-ahorro-side-panel
          [actions]="actions"
          [alerts]="alerts"
          [reports]="reports">
        </app-ahorro-side-panel>
      </div>
    </div>
  </div>
</section>
