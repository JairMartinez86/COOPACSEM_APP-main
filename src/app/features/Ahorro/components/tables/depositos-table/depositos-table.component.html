<div class="card">
  <div class="card-body p-0">

    <div class="table-responsive">
      <table class="table table-sm mb-0">
        <thead>
          <tr>
            <th>FECHA</th>
            <th>DESCRIPCIÓN</th>
            <th>TIPO DE CUENTA</th>
            <th class="text-end">MONTO</th>
            <th class="text-end">SALDO</th>
          </tr>
        </thead>

        <tbody>
          @for (row of rows; track $index) {
            <tr>

              <!-- FECHA -->
              <td>{{ row.fecha }}</td>

              <!-- DESCRIPCIÓN -->
              <td>
                <div class="fw-semibold">{{ row.descripcion }}</div>
              </td>

              <!-- TIPO CUENTA -->
              <td>
                <span
                  class="badge"
                  [ngClass]="row.tipoCuenta === 'Corriente'
                    ? 'badge-soft-success'
                    : 'badge-soft-warning'">
                  {{ row.tipoCuenta }}
                </span>
              </td>

              <!-- MONTO -->
              <td class="text-end">
                {{ row.monto }}
              </td>

              <!-- SALDO -->
              <td class="text-end">
                {{ row.saldo }}
              </td>

            </tr>
          }
        </tbody>

      </table>
    </div>

  </div>
</div>
