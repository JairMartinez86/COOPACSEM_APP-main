<div class="page-scale">
  <app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>

<section class="section ahorro-section">
  <div class="main-content ahorro-content">

    <div class="page-header ahorro-page-header">
      <div>
        <h1 class="page-title">{{ 'ahorro.page.title' | translate }}</h1>
        <p class="text-muted mb-0">
          {{ 'ahorro.page.subtitle' | translate }}
        </p>
      </div>
    </div>

    <div class="ahorro-top-panel" [class.is-hidden]="summaryPanelHidden">

      <button type="button" class="ahorro-panel-toggle" (click)="summaryPanelHidden = !summaryPanelHidden">

        <i class="fa-solid" [ngClass]="summaryPanelHidden ? 'fa-chevron-down' : 'fa-chevron-up'">
        </i>

        <span>
          {{
          summaryPanelHidden
          ? ('ahorro.actions.showFilters' | translate)
          : ('ahorro.actions.hideFilters' | translate)
          }}
        </span>
      </button>

      <div class="ahorro-summary-wrapper">
        <app-ahorro-summary-cards [cards]="cards"></app-ahorro-summary-cards>

        <app-ahorro-filters (filtersChange)="onFiltersChange($event)">
        </app-ahorro-filters>
      </div>

    </div>



    <div class="row g-2 ahorro-main-row mt-0">
      <div class="col-12">
        <div class="card ahorro-card">
          <div class="card-body ahorro-card-body">


            <app-socios-table [rows]="socioRows" [pagination]="pagination" [selectedId]="selectedSocioId"
              (selectRow)="onSelectSocio($event)" (pageChange)="onPageChange($event)">
            </app-socios-table>

          </div>
        </div>

        <div class="ahorro-resumen-wrapper">
          <app-ahorro-socio-resumen [socio]="selectedSocio" [ahorrosRows]="ahorroRows" [retirosRows]="retiroRows"
            [depositosRows]="depositoRows" [cambiosCuotaRows]="cambioCuotaRows" [solicitudesRows]="solicitudRows"
            [afiliacionMembresiaRows]="afiliacionMembresiaRows" [planesRows]="planesRows">
          </app-ahorro-socio-resumen>
        </div>

      </div>
    </div>
  </div>
</section>

<div class="offcanvas offcanvas-end ahorro-side-offcanvas" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1"
  id="ahorroSidePanelOffcanvas">

  <div class="offcanvas-header ahorro-offcanvas-header">
    <h5 class="offcanvas-title mb-0">
      {{ 'ahorro.sidePanel.title' | translate }}
    </h5>

    <button type="button" class="btn-close" data-bs-dismiss="offcanvas">
    </button>
  </div>

  <div class="offcanvas-body ahorro-offcanvas-body">
    <app-ahorro-side-panel [actions]="actions" [alerts]="alerts" [reports]="reports" [planesRows]="planesRows"
      [selectedSocio]="selectedSocio">
    </app-ahorro-side-panel>
  </div>
</div>
</div>
